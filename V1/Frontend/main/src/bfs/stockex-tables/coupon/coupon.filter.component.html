<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Name</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Name" value="{{result.Name}}" placeholder="Name" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Trading Room</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.TradingRoomId" name="tradingRoomId">
          <ng-container *ngFor="let option of TradingRoomOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Stock Share</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.StockShareId" name="stockShareId">
          <ng-container *ngFor="let option of StockShareOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Coupon Type</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.CouponTypeId" name="couponTypeId">
          <ng-container *ngFor="let option of CouponTypeOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Coupon Status</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.CouponStatusId" name="couponStatusId">
          <ng-container *ngFor="let option of CouponStatusOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Value</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="ValueFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="ValueTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Announce Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="date"  [(ngModel)]="AnnounceDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="date"  [(ngModel)]="AnnounceDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Value Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="date"  [(ngModel)]="ValueDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="date"  [(ngModel)]="ValueDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Due Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="date"  [(ngModel)]="DueDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="date"  [(ngModel)]="DueDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Percent</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="CouponPercentFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="CouponPercentTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

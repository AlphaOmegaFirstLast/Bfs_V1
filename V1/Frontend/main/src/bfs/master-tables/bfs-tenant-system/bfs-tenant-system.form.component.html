<div class="container-fluid">
    <div class="pb-2"></div>
    <div class="card">
        <div class="card-body">

            <ul ngbNav #nav="ngbNav" class="nav nav-tabs mb-3" [activeId]="1">
                <li [ngbNavItem]="1">
                    <a href="javascript:void(0)" ngbNavLink> Tenant - System </a>
                    <!----------------------------------------- Tab1 Contents -------------------------------------->
                    <ng-template ngbNavContent>
                        <form card-body class="g-3 needs-validation" novalidate (ngSubmit)="validSubmit()" [formGroup]="validationForm">
                            <div class="card fs-6">
                                <!-----------------------------------------Header Buttons -------------------------------------->

                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='add'">Add</button>
                                        <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='edit'">Update</button>
                                        <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='delete'">Delete</button>
                                        <a [routerLink]="['/mstr/bfs-tenant-system/list']" class="btn btn-sm btn-outline-primary" *ngIf="currentOperation=='view'">Back</a>
                                        <a [routerLink]="['/mstr/bfs-tenant-system/list']" class="btn btn-sm btn-outline-primary" *ngIf="currentOperation!='view'">Cancel</a>
                                    </div>
                                    <div class="btn-group">
                                        <div ngbDropdown>
                                            <button class="btn btn-sm  btn-primary" type="button" ngbDropdownToggle> Actions </button>
                                            <div ngbDropdownMenu>
                                                <a *ngIf="currentOperation=='add' || currentOperation=='edit'" ngbDropdownItem href="javascript:void(0)" (click)="resetForm()">Reset Form</a>

                                                <div *ngFor="let link of getRecordLinks(me)">
                                                    <a *ngIf="isAccessible(link)" [routerLink]="[link.route, link.recordId]" ngbDropdownItem>{{link.displayText}}</a>
                                                </div>
                                                <div *ngFor="let link of getRecordActions(me)">
                                                    <a *ngIf="isAccessible(link)" ngbDropdownItem href="javascript:void(0)" (click)="link.action(me, me.entity, link.data)">{{link.displayText}}</a>
                                                </div>

                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body">
                                    <!----------------------------------------- Messages -------------------------------------->
                                    <div *ngFor="let msg of messages">
                                        <div *ngIf="msg.text">
                                            <ngb-alert type="{{msg.msgType}}" class="d-flex align-items-center gap-1 mb-2" [dismissible]="true" (click)="msg.text = '' " role="alert">
                                                <ng-icon name="tablerAlertOctagon" class="fs-xl"></ng-icon> {{ msg.text }}
                                            </ngb-alert>
                                        </div>
                                    </div>
                                    <!----------------------------------------- Form Controls -------------------------------------->
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="row mb-2">
                                                <div class="col-6">
                                                    <label for="id" class="form-label fs-6">ID</label>
                                                    <input class="form-control" type="text" id="id" formControlName="id"
                                                        [class]="submit && !form['id'].errors ? 'is-valid': submit && form['id'].errors ? 'is-invalid' : ''" />
                                                    <div class="valid-feedback">Looks good!</div>
                                                    <div class="invalid-feedback">Invalid ID.</div>
                                                </div>
                                            </div>

                                            <div class="position-relative" (focusout)="hideOverlay()">
                                                <label class="form-label">Tenant Name</label>
                                                <div class="input-group">
                                                    <input type="text"  class="form-control" [formControl]="searchControl"
                                                        (focus)="searchControl.value.length >= 2 && (showTenantOptions = true)"
                                                         autocomplete="off" placeholder="Type at least 2 characters..." >                                                    
                                                    <span class="input-group-text" *ngIf="isLoading">
                                                        <span class="spinner-border spinner-border-sm"></span>
                                                    </span>
                                                </div>
                                                <ul class="dropdown-menu show w-100 shadow-sm" style="max-height: 200px; overflow-y: auto;"
                                                    *ngIf="showTenantOptions && BfsTenantOptions.length > 0">
                                                    <li *ngFor="let option of BfsTenantOptions">
                                                        <button type="button"
                                                            class="dropdown-item d-flex justify-content-between align-items-center"
                                                            (click)="selectTenant(option)">
                                                            <span>{{ option.name }}</span>
                                                            <small class="text-muted">ID: {{ option.id }}</small>
                                                        </button>
                                                    </li>
                                                </ul>
                                                <ul class="dropdown-menu show w-100" *ngIf="showTenantOptions && !isLoading && BfsTenantOptions.length === 0">
                                                    <li><span class="dropdown-item-text text-muted">No tenants found.</span></li>
                                                </ul>
                                            </div>

                                            <div class="row mb-2">
                                                <div class="col-12">
                                                    <label for="bfsSystemId" class="form-label fs-6">BestFit System</label>
                                                    <select class="form-select" id="bfsSystemId" formControlName="bfsSystemId"
                                                        [class]="submit && !form['bfsSystemId'].errors ? 'is-valid': submit && form['bfsSystemId'].errors ? 'is-invalid' : ''">
                                                        <ng-container *ngFor="let option of BfsSystemOptions">
                                                            <option [value]="option['id']">{{ option['name'] }}</option>
                                                        </ng-container>
                                                    </select>
                                                    <div class="invalid-feedback">Please select a valid BestFit System.</div>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </div>
                        </form>
                        <!----------------------------------------- End Form -------------------------------------->

                    </ng-template>
                </li>

                <!----------------------------------------------------- Tabs -------------------------------------->

            </ul>

            <div class="tab-content" [ngbNavOutlet]="nav">
            </div>
        </div>
    </div>
</div>

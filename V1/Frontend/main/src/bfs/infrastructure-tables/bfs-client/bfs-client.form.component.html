<div class="container-fluid">
    <div class="pb-2"></div>
    <div class="card">
        <div class="card-body">

            <ul ngbNav #nav="ngbNav" class="nav nav-tabs mb-3" [activeId]="1">
                <li [ngbNavItem]="1">
                    <a href="javascript:void(0)" ngbNavLink> BestFit Clients </a>
                    <!----------------------------------------- Tab1 Contents -------------------------------------->
                    <ng-template ngbNavContent>
                        <form card-body class="g-3 needs-validation" novalidate (ngSubmit)="validSubmit()" [formGroup]="validationForm">
                            <div class="card fs-6">
                                <!-----------------------------------------Header Buttons -------------------------------------->

                                <div class="card-header d-flex justify-content-between align-items-center">
                                        <div class="btn-group">
                                            <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='add'" >Add</button>
                                            <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='edit'" >Update</button>
                                            <button type="submit" class="btn btn-sm btn-outline-primary me-2" *ngIf="currentOperation=='delete'" >Delete</button>
                                             <a [routerLink]="['/bfs/bfs-client/list']" class="btn btn-sm btn-outline-primary" *ngIf="currentOperation=='view'" >Back</a>
                                             <a [routerLink]="['/bfs/bfs-client/list']" class="btn btn-sm btn-outline-primary" *ngIf="currentOperation!='view'" >Cancel</a>
                                        </div>
                                        <div class="btn-group">
                                            <div ngbDropdown>
                                                <button class="btn btn-sm  btn-primary" type="button" ngbDropdownToggle> Actions </button>
                                                <div ngbDropdownMenu>
                                                    <a *ngIf="currentOperation=='add' || currentOperation=='edit'" ngbDropdownItem href="javascript:void(0)" (click)="resetForm()">Reset Form</a>
                                                    <a ngbDropdownItem [routerLink]="['/bfs/bfs-client/list']">Go to List</a>
                                                    <a ngbDropdownItem href="javascript:void(0)">Activate</a>
                                                </div>
                                            </div>
                                        </div>
                                </div>
                                <div class="card-body">
                                    <!----------------------------------------- Messages -------------------------------------->
                                    <div *ngFor="let msg of messages">
                                        <div *ngIf="msg.text">
                                            <ngb-alert type="{{msg.msgType}}" class="d-flex align-items-center gap-1 mb-2" [dismissible]="true" (click)="msg.text = '' " role="alert">
                                                <ng-icon name="tablerAlertOctagon" class="fs-xl"></ng-icon> {{ msg.text }}
                                            </ngb-alert>
                                        </div>
                                    </div>
                                    <!----------------------------------------- Form Controls -------------------------------------->
                                    <div class="row">
                                    <div class="col-6">
<div class="row mb-2">
    <div class="col-6">
        <label for="id" class="form-label fs-6">ID</label>
        <input class="form-control" type="text" id="id" formControlName="id"
            [class]="submit && !form['id'].errors ? 'is-valid': submit && form['id'].errors ? 'is-invalid' : ''" />
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Invalid ID.</div>
    </div>
</div>

<div class="row mb-2">
    <div class="col-12">
        <label for="name" class="form-label fs-6">Name</label>
        <ng-icon name="tablerInfo-Circle" class="text-info fs-16" style="margin-left:2px"  popoverTitle="Info" ngbPopover="" style='display:none' />

        <input class="form-control" type="text" id="name" formControlName="name"
            [class]="submit && !form['name'].errors ? 'is-valid': submit && form['name'].errors ? 'is-invalid' : ''" />
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Invalid Name.</div>
    </div>
</div>

<div class="row mb-2">
    <div class="col-12">
        <label for="notes" class="form-label fs-6">Notes</label>
        <ng-icon name="tablerInfo-Circle" class="text-info fs-16" style="margin-left:2px"  popoverTitle="Info" ngbPopover="" style='display:none' />

        <input class="form-control" type="text" id="notes" formControlName="notes"
            [class]="submit && !form['notes'].errors ? 'is-valid': submit && form['notes'].errors ? 'is-invalid' : ''" />
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Invalid Notes.</div>
    </div>
</div>

<div class="row mb-2">
    <div class="col-12">
        <label for="dbConnection" class="form-label fs-6">Database Connection</label>
        <ng-icon name="tablerInfo-Circle" class="text-info fs-16" style="margin-left:2px"  popoverTitle="Info" ngbPopover="Db connection requires high security. should be stored in KeyValueSecret instead. Each Client should have his own Database for all his systems."  />

        <input class="form-control" type="text" id="dbConnection" formControlName="dbConnection"
            [class]="submit && !form['dbConnection'].errors ? 'is-valid': submit && form['dbConnection'].errors ? 'is-invalid' : ''" />
        <div class="valid-feedback">Looks good!</div>
        <div class="invalid-feedback">Invalid Database Connection.</div>
    </div>
</div>

</div>

                                    </div>
                                </div>
                            </div>
                        </form>
                        <!----------------------------------------- End Form -------------------------------------->

                    </ng-template>
                </li>

                <!----------------------------------------------------- Tabs -------------------------------------->

            </ul>

            <div class="tab-content" [ngbNavOutlet]="nav">
            </div>
        </div>
    </div>
</div>

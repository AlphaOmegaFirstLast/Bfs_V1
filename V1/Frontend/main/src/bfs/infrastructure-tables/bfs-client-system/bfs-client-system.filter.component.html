<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Client Name</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BfsClientId" name="bfsClientId">
          <ng-container *ngFor="let option of BfsClientOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>BestFit System</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BfsSystemId" name="bfsSystemId">
          <ng-container *ngFor="let option of BfsSystemOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

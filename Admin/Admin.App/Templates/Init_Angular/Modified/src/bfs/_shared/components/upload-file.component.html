<div class="modal-header">
  <h4 class="modal-title">JSON File Uploader</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">

  <div class="row">
    <div class="col-12 pb-2">
      <label>Select JSON File to Upload</label>
    </div>
  </div>

  <div class="row">
    <div class="col-12 pb-2">
      <input
        type="file"
        (change)="onFileSelected($event)"
        accept=".json,application/json"
        class="btn btn-outline-dark">
    </div>
  </div>

  @if (selectedFile()) {
  <div class="row">
    <div class="col-12 pb-2">
      <p class="mt-3 text-sm text-gray-600">
        Selected: <span class="font-semibold">{{ selectedFile()!.name }}</span> ({{ (selectedFile()!.size / 1024 / 1024).toFixed(2) }} MB)
      </p>
    </div>
  </div>
  }
  <!----------------------------------------- Progress bar -------------------------------------->
  @if (uploadStatus()) {
  <ngb-progressbar class="mb-3" type="primary" [value]="uploadProgress()">{{ uploadProgress() }}%</ngb-progressbar>
  }

  @if (uploadStatus()) {
  <div class="row">
    <div class="col-12 pb-2"> <!-- Status Message Display -->
      <div [ngClass]="{'bg-green-100 border-green-400 text-green-700': uploadStatus() === 'Success', 'bg-red-100 border-red-400 text-red-700': uploadStatus() === 'Error', 'bg-blue-100 border-blue-400 text-blue-700': uploadStatus() === 'Pending'}"
        class="border p-4 rounded-lg transition-colors duration-300">
        <h3 class="text-lg font-bold mb-1">Status: {{ uploadStatus() }}</h3>
        <p class="text-sm break-all">{{ statusMessage() }}</p>
      </div>
    </div>
  </div>
  }


  <!----------------------------------------- Modal Buttns  -------------------------------------->
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-outline-dark" (click)="upload()" [disabled]="!selectedFile() || isUploading()">Upload</button>
  </div>

<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>StocksShare Transaction</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SspTransactionId" name="sspTransactionId">
          <ng-container *ngFor="let option of SspTransactionOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Transaction Type</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.TransactionTypeId" name="transactionTypeId">
          <ng-container *ngFor="let option of TransactionTypeOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Expenses Type</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.ExpensesTypeId" name="expensesTypeId">
          <ng-container *ngFor="let option of ExpensesTypeOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Currency</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.CurrencyId" name="currencyId">
          <ng-container *ngFor="let option of CurrencyOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <!-- SsPortfolioAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="ssPortfolioAuto.hideOverlay()">
          <label class="d-flex align-items-center form-label fs-6">Portfolio       
            <lucide-angular [img]="LucideSearch" class="text-info fs-5 m-1" />
          </label> 
          <div class="input-group">
            <input id="ssPortfolioControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 3 characters..." 
              [(ngModel)]="result.SsPortfolioName"
              (ngModelChange)="ssPortfolioAuto.onInputChange($event)" 
              (focus)="ssPortfolioAuto.onFocus()" />
            <span class="input-group-text" *ngIf="ssPortfolioAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="ssPortfolioAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="ssPortfolioAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of ssPortfolioAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); ssPortfolioAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="ssPortfolioAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Portfolio .</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- SsPortfolio AutoComplete End -->

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Transaction Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="TransactionDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="TransactionDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Value</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="ValueFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="ValueTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

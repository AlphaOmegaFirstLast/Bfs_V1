<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Name</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Name" value="{{result.Name}}" placeholder="Name" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <!-- BrokerAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="brokerAuto.hideOverlay()">
          <label class="form-label fs-6">Component</label>
          <div class="input-group">
            <input id="brokerControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 2 characters..." 
              [(ngModel)]="result.BrokerName"
              (ngModelChange)="brokerAuto.onInputChange($event)" 
              (focus)="brokerAuto.onFocus()" />
            <span class="input-group-text" *ngIf="brokerAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="brokerAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="brokerAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of brokerAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); brokerAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="brokerAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Component.</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Broker AutoComplete End -->
  <!-- InvestorAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="investorAuto.hideOverlay()">
          <label class="form-label fs-6">Component</label>
          <div class="input-group">
            <input id="investorControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 2 characters..." 
              [(ngModel)]="result.InvestorName"
              (ngModelChange)="investorAuto.onInputChange($event)" 
              (focus)="investorAuto.onFocus()" />
            <span class="input-group-text" *ngIf="investorAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="investorAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="investorAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of investorAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); investorAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="investorAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Component.</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Investor AutoComplete End -->

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

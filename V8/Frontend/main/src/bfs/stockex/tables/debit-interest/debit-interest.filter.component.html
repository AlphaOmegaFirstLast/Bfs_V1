<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Name</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Name" value="{{result.Name}}" placeholder="Name" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Notes</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Notes" value="{{result.Notes}}" placeholder="Notes" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Payment Mode</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.PaymentModeId" name="paymentModeId">
          <ng-container *ngFor="let option of PaymentModeOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Broker Agreement</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BrokerAgreementId" name="brokerAgreementId">
          <ng-container *ngFor="let option of BrokerAgreementOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Interest Percent</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="InterestPercentFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="InterestPercentTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

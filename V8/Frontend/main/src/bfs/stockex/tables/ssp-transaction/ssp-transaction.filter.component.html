<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Name</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Name" value="{{result.Name}}" placeholder="Name" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Transaction Type</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.TransactionTypeId" name="transactionTypeId">
          <ng-container *ngFor="let option of TransactionTypeOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Stock Share</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.StockShareId" name="stockShareId">
          <ng-container *ngFor="let option of StockShareOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Currency</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.CurrencyId" name="currencyId">
          <ng-container *ngFor="let option of CurrencyOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <!-- SsPortfolioAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="ssPortfolioAuto.hideOverlay()">
          <label class="form-label fs-6">StockShare Portfolio</label>        
          <ng-icon name="tablerInfo-Circle" class="text-info fs-16" style="margin-left:2px"  popoverTitle="Info" ngbPopover="AutoComplete" />

          <div class="input-group">
            <input id="ssPortfolioControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 2 characters..." 
              [(ngModel)]="result.SsPortfolioName"
              (ngModelChange)="ssPortfolioAuto.onInputChange($event)" 
              (focus)="ssPortfolioAuto.onFocus()" />
            <span class="input-group-text" *ngIf="ssPortfolioAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="ssPortfolioAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="ssPortfolioAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of ssPortfolioAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); ssPortfolioAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="ssPortfolioAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Component.</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- SsPortfolio AutoComplete End -->
  <!-- ToPortfolioAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="toPortfolioAuto.hideOverlay()">
          <label class="form-label fs-6">To Portfolio</label>        
          <ng-icon name="tablerInfo-Circle" class="text-info fs-16" style="margin-left:2px"  popoverTitle="Info" ngbPopover="AutoComplete" />

          <div class="input-group">
            <input id="toPortfolioControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 2 characters..." 
              [(ngModel)]="result.ToPortfolioName"
              (ngModelChange)="toPortfolioAuto.onInputChange($event)" 
              (focus)="toPortfolioAuto.onFocus()" />
            <span class="input-group-text" *ngIf="toPortfolioAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="toPortfolioAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="toPortfolioAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of toPortfolioAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); toPortfolioAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="toPortfolioAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Component.</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- ToPortfolio AutoComplete End -->

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Source Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="SourceDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="SourceDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Transaction Date</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="TransactionDateFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="text" mwlFlatpickr [altInput]="true" dateFormat="Y-m-d" altFormat="d/m/Y" [(ngModel)]="TransactionDateTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Quantity</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="QuantityFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="QuantityTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Price</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="PriceFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="PriceTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>To Quantity</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="ToQuantityFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="ToQuantityTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

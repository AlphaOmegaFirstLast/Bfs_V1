<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>StockShare Portfolio</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.OverdraftPortfolio_SsPortfolioId" name="ssPortfolioId">
          <ng-container *ngFor="let option of SsPortfolioOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Investor</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BrokerAgreement_InvestorId" name="investorId">
          <ng-container *ngFor="let option of InvestorOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Broker</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BrokerAgreement_BrokerId" name="brokerId">
          <ng-container *ngFor="let option of BrokerOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Currency</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SsPortfolioBalance_CurrencyId" name="currencyId">
          <ng-container *ngFor="let option of CurrencyOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

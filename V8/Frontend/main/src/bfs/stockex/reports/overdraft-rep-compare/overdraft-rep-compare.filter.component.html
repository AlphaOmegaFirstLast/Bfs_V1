<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.OverdraftPortfolio_Id" value="{{result.OverdraftPortfolio_Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Name</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.OverdraftPortfolio_Name" value="{{result.OverdraftPortfolio_Name}}" placeholder="Name" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>StockShare Portfolio</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.OverdraftPortfolio_SsPortfolioId" name="ssPortfolioId">
          <ng-container *ngFor="let option of SsPortfolioOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Broker Agreement</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.OverdraftPortfolio_BrokerAgreementId" name="brokerAgreementId">
          <ng-container *ngFor="let option of BrokerAgreementOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Overdraft Percent</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="OverdraftPortfolio_OverdraftPercentFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="OverdraftPortfolio_OverdraftPercentTo">
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Overdraft Max</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="OverdraftPortfolio_OverdraftMaxFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="OverdraftPortfolio_OverdraftMaxTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

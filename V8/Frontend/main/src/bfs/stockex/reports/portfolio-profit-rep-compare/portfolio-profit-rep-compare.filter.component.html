<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>StockShare Portfolio</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SspStock_SsPortfolioId" name="ssPortfolioId">
          <ng-container *ngFor="let option of SsPortfolioOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>StockShare </label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SspStock_StockShareId" name="stockShareId">
          <ng-container *ngFor="let option of StockShareOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Currency</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SspStock_CurrencyId" name="currencyId">
          <ng-container *ngFor="let option of CurrencyOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Profit</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="CurrentPrice_ProfitFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="CurrentPrice_ProfitTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

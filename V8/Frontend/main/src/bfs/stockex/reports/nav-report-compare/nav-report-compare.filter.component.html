<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Investor</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SsPortfolio_InvestorId" name="investorId" (change)="filterChange()">
          <ng-container *ngFor="let option of InvestorOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Broker</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SsPortfolio_BrokerId" name="brokerId" (change)="filterChange()">
          <ng-container *ngFor="let option of BrokerOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Portfolio of Investor & Broker</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.SsPortfolio_SsPortfolioId" name="portfolioId" [disabled]="!(result.SsPortfolio_InvestorId) && !(result.SsPortfolio_BrokerId)">
          <ng-container *ngFor="let option of PortfolioOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Nav</label>
      </div>
      <div class="col -8">
        <label class="me-2">from</label><input class="form-control me-4" type="number"  [(ngModel)]="sumNavFrom">
        <label class="me-2">To</label><input class="form-control me-4" type="number"  [(ngModel)]="sumNavTo">
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>

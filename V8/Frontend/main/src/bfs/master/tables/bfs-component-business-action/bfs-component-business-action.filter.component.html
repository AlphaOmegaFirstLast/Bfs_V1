<div class="modal-header">
  <h4 class="modal-title">Filter</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <div class="form-control">

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>ID</label>
      </div>
      <div class="col -8">
      <input class="form-control" type="text" [(ngModel)]="result.Id" value="{{result.Id}}" placeholder="ID" #ctrl="ngModel"/>
      </div>
    </div>
  </div>

      <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Business Action</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.BusinessActionId" name="businessActionId">
          <ng-container *ngFor="let option of BusinessActionOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>
  <div class="form-control">
    <div class="row">
      <div class="col -4">
        <label>Action Location</label>
      </div>
      <div class="col -8">
        <select class="form-select" [(ngModel)]="result.ActionLocationId" name="actionLocationId">
          <ng-container *ngFor="let option of ActionLocationOptions">
            <option [value]="option['id']">{{ option['name'] }}</option>
          </ng-container>
        </select>
      </div>
    </div>
  </div>

      <!-- BfsComponentAutoComplete Start -->
    <div class="row mb-2">
      <div class="col-12">
        <div class="position-relative" (focusout)="bfsComponentAuto.hideOverlay()">
          <label class="d-flex align-items-center form-label fs-6">Component Name       
            <lucide-angular [img]="LucideSearch" class="text-info fs-5 m-1" />
          </label> 
          <div class="input-group">
            <input id="bfsComponentControl" type="text" class="form-control" autocomplete="off" placeholder="Type at least 3 characters..." 
              [(ngModel)]="result.BfsComponentName"
              (ngModelChange)="bfsComponentAuto.onInputChange($event)" 
              (focus)="bfsComponentAuto.onFocus()" />
            <span class="input-group-text" *ngIf="bfsComponentAuto.isLoading">
              <span class="spinner-border spinner-border-sm"></span>
            </span>
          </div>
          <span class="input-group-text" *ngIf="bfsComponentAuto.isLoading"><span
              class="spinner-border spinner-border-sm"></span></span>
        </div>

        <ul *ngIf="bfsComponentAuto.isShowList()" class="dropdown-menu show w-100 shadow-sm"
          style="max-height: 200px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px; z-index: 1000;">
          <li *ngFor="let option of bfsComponentAuto.optionList; let i = index">
            <button type="button" class="dropdown-item d-flex justify-content-between align-items-center"
              (mousedown)="$event.preventDefault(); bfsComponentAuto.onSelect(option)">
              <span>{{ option.name }}</span> <small class="text-muted">ID: {{ option.id }}</small>
            </button>
          </li>
        </ul>

        <ul class="dropdown-menu show w-100" *ngIf="bfsComponentAuto.isError">
          <li><span class="dropdown-item-text text-muted">Please select a valid Component Name .</span></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- BfsComponent AutoComplete End -->

  <div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="reset()">Reset</button>
    <button type="button" class="btn btn-outline-dark" (click)="apply()">Apply</button>
  </div>
